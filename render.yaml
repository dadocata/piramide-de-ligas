services:
  - type: web
    name: piramide-de-ligas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/auth/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: SESSIONS_DAYS
        value: '30'
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_FAVORITE_CLUB
        sync: false
      - key: REGISTER_CODE
        sync: false